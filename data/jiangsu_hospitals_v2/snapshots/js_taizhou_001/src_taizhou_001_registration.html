  <article data-source-url="https://www.jstzhospital.com/gwrk/xwzx/yyxw/content_1772">
    <h1>我院微信公众号“报告查询功能”成功升级</h1>
    <p>泰州市人民医院微信公众号的“预约挂号”功能已经上线。</p>
    <p>首先搜索“泰州市人民医院”微信公众号并关注，进入医院公众号进行实名认证；在屏幕下方“就诊中心”选择“挂号小程序”并添加就诊人，即可进入实名认证步骤。</p>
    <p>一个微信公众号可以添加数名就诊人。</p>
